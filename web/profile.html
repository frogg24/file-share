<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/">File <span>Share</span></a>

            <nav class="main-nav" aria-label="Основная навигация">
                <a href="/">Файлы</a>
                <a href="/upload">Загрузить файл</a>
            </nav>

            <a class="account-link" href="/profile" aria-current="page">
                Профиль
            </a>
        </div>
    </header>

    <main class="profile-page">

        <div class="profile-heading">
            <h1 class="section-heading">Профиль</h1>
            <button id="logout-button" class="logout-button" type="button">
                Выйти
            </button>
        </div>
        <p id="profile-status" class="message" role="status">
            Загружаем данные…
        </p>

        <section class="profile-panel" aria-labelledby="account-heading">
            <h2 id="account-heading">Данные аккаунта</h2>

            <dl class="profile-fields">
                <div>
                    <dt>Логин</dt>
                    <dd id="profile-login">—</dd>
                </div>
                <div>
                    <dt>Отображаемое имя</dt>
                    <dd class="profile-name-row">
                    <span id="profile-name">—</span>
                    <button id="edit-name-button"
                            class="logout-button"
                            type="button"
                            disabled>
                        Изменить
                    </button>
                    </dd>
                </div>
                <div>
                    <dt>Дата регистрации</dt>
                    <dd id="profile-created">—</dd>
                </div>
                <div>
                    <dt>Последнее изменение аккаунта</dt>
                    <dd id="profile-updated">—</dd>
                </div>
                <div class="profile-id-field">
                    <dt>ID пользователя</dt>
                    <dd id="profile-id">—</dd>
                </div>
            </dl>
        </section>

        <section class="profile-panel" aria-labelledby="files-heading">
            <h2 id="files-heading">Загруженные файлы</h2>
            <p id="files-status" class="message" role="status"></p>

            <div id="files-table-container" class="table-container" hidden>
                <table class="files-table">
                    <thead>
                        <tr>
                            <th scope="col">Название</th>
                            <th scope="col">Размер, байт</th>
                            <th scope="col">Дата загрузки</th>
                            <th scope="col">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="files-body"></tbody>
                </table>
            </div>

            <nav id="files-pagination"
                class="files-pagination"
                aria-label="Страницы ваших файлов"
                hidden>
                <button id="files-prev" class="logout-button" type="button">
                    Назад
                </button>

                <span id="files-page-info" role="status"></span>

                <button id="files-next" class="logout-button" type="button">
                    Далее
                </button>

                <button id="files-refresh" class="logout-button" type="button">
                    Обновить
                </button>
            </nav>

        </section>
    </main>
    <dialog id="name-dialog" class="name-dialog" aria-label="Изменить имя">
        <form id="name-form" novalidate>
            <div class="field">
                <input id="name-input"
                    type="text"
                    aria-label="Новое имя"
                    placeholder="Новое имя"
                    autocomplete="nickname"
                    required
                    autofocus>
            </div>

            <div class="name-dialog-actions">
                <button id="save-name-button"
                        class="submit-button"
                        type="submit">
                    Сохранить
                </button>
                <button id="cancel-name-button"
                        class="logout-button"
                        type="button">
                    Отмена
                </button>
            </div>
        </form>
    </dialog>
    <script>
        (() => {
            const profileStatus = document.querySelector("#profile-status");
            const filesStatus = document.querySelector("#files-status");
            const filesBody = document.querySelector("#files-body");
            const filesTable = document.querySelector("#files-table-container");
            const filesPagination = document.querySelector("#files-pagination");
            const filesPrev = document.querySelector("#files-prev");
            const filesNext = document.querySelector("#files-next");
            const filesRefresh = document.querySelector("#files-refresh");
            const filesPageInfo = document.querySelector("#files-page-info");
            const logoutButton = document.querySelector("#logout-button");
            const editNameButton = document.querySelector("#edit-name-button");
            const nameDialog = document.querySelector("#name-dialog");
            const nameForm = document.querySelector("#name-form");
            const nameInput = document.querySelector("#name-input");
            const saveNameButton = document.querySelector("#save-name-button");
            const cancelNameButton = document.querySelector("#cancel-name-button");
            const filesPageSize = 10;
            let currentProfile = null;
            let filesPage = 1;
            let filesTotal = 0;
            let filesBusy = false;
            function errorMessage(error) {
                return error instanceof TypeError
                    ? "Не удалось связаться с сервером."
                    : error.message || "Не удалось выполнить запрос.";
            }
            function setFilesStatus(message, state = "info") {
                filesStatus.textContent = message;
                filesStatus.dataset.state = state;
            }
            async function getJSON(url, options = {}) {
                const response = await fetch(url, {
                    ...options,
                    cache: "no-store"
                });
                if (response.status === 401) {
                    window.location.replace("/auth");
                    return null;
                }
                if (response.status === 204) {
                    return;
                }
                const contentType = response.headers.get("Content-Type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error(
                        "Неожиданный ответ сервера. HTTP: " + response.status
                    );
                }
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(
                        result.error || "Не удалось выполнить запрос."
                    );
                }
                return result;
            }
            function formatDate(value) {
                return new Date(value).toLocaleString("ru-RU");
            }
            function renderProfile(user) {
                currentProfile = user;
                document.querySelector("#profile-login").textContent = user.login;
                document.querySelector("#profile-name").textContent = user.display_name;
                document.querySelector("#profile-id").textContent = user.id;
                document.querySelector("#profile-created").textContent =
                    formatDate(user.created_at);
                document.querySelector("#profile-updated").textContent =
                    formatDate(user.updated_at);
                editNameButton.disabled = false;
            }
            function updateFilesPagination() {
                const pageCount = Math.max(
                    1,
                    Math.ceil(filesTotal / filesPageSize)
                );
                filesPageInfo.textContent =
                    "Страница " + filesPage + " из " + pageCount;
                filesPrev.disabled = filesBusy || filesPage <= 1;
                filesNext.disabled = filesBusy || filesPage >= pageCount;
                filesRefresh.disabled = filesBusy;
                for (const button of filesBody.querySelectorAll(".delete-file-button")) {
                    button.disabled = filesBusy;
                }
            }
            function renderFiles(files) {
                filesBody.replaceChildren();
                for (const file of files) {
                    const row = document.createElement("tr");
                    const name = document.createElement("td");
                    name.textContent = file.original_name;
                    const size = document.createElement("td");
                    size.textContent =
                        new Intl.NumberFormat("ru-RU").format(file.size);
                    const created = document.createElement("td");
                    created.textContent = formatDate(file.created_at);
                    const actions = document.createElement("td");
                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.className = "logout-button delete-file-button";
                    deleteButton.textContent = "Удалить";
                    deleteButton.disabled = filesBusy;
                    deleteButton.setAttribute(
                        "aria-label",
                        "Удалить файл " + file.original_name
                    );
                    deleteButton.addEventListener("click", () => {
                        deleteFile(file, row, deleteButton);
                    });
                    actions.append(deleteButton);
                    row.append(name, size, created, actions);
                    filesBody.append(row);
                }
                filesTable.hidden = files.length === 0;
                setFilesStatus(
                    files.length === 0
                        ? "На этой странице файлов нет."
                        : ""
                );
            }
            async function loadFiles(page = 1) {
                if (!currentProfile || filesBusy) return;
                filesBusy = true;
                updateFilesPagination();
                setFilesStatus("Загружаем список…");
                try {
                    const query = new URLSearchParams({
                        owner_id: currentProfile.id,
                        page_size: String(filesPageSize),
                        sort: "name",
                        order: "asc"
                    });
                    let result;
                    while (true) {
                        query.set("page", String(page));
                        result = await getJSON("/api/catalog/files?" + query);
                        if (result === null) return;
                        const lastPage = Math.max(
                            1,
                            Math.ceil(result.total / filesPageSize)
                        );
                        if (page <= lastPage) break;
                        // Запрошенная страница исчезла после удаления файлов.
                        page = lastPage;
                    }
                    filesPage = result.page;
                    filesTotal = result.total;
                    renderFiles(result.items);
                    filesPagination.hidden = false;
                } catch (error) {
                    setFilesStatus(errorMessage(error), "error");
                } finally {
                    filesBusy = false;
                    updateFilesPagination();
                }
            }
            async function deleteFile(file, row, button) {
                if (filesBusy || button.disabled) return;
                const confirmed = window.confirm(
                    "Удалить файл «" + file.original_name + "»?"
                );
                if (!confirmed) return;
                filesBusy = true;
                updateFilesPagination();
                button.textContent = "Удаление…";
                setFilesStatus(
                    "Удаляем файл «" + file.original_name + "»…"
                );
                try {
                    const result = await getJSON(
                        "/api/upload/files/" + encodeURIComponent(file.id),
                        { method: "DELETE" }
                    );
                    if (result === null) return;
                    row.remove();
                    filesTable.hidden = filesBody.childElementCount === 0;
                    setFilesStatus(
                        "Файл «" + file.original_name + "» помечен удалённым.",
                        "success"
                    );
                } catch (error) {
                    setFilesStatus(
                        "«" + file.original_name + "»: " + errorMessage(error),
                        "error"
                    );
                } finally {
                    filesBusy = false;
                    button.textContent = "Удалить";
                    updateFilesPagination();
                }
            }
            function setNameSaving(saving) {
                for (const control of nameForm.elements) {
                    control.disabled = saving;
                }
            }
            editNameButton.addEventListener("click", () => {
                if (!currentProfile || nameDialog.open) return;
                nameInput.value = currentProfile.display_name;
                nameInput.setCustomValidity("");
                nameDialog.showModal();
                nameInput.select();
            });
            cancelNameButton.addEventListener("click", () => {
                nameDialog.close();
            });
            nameDialog.addEventListener("cancel", (event) => {
                if (saveNameButton.disabled) {
                    event.preventDefault();
                }
            });
            nameInput.addEventListener("input", () => {
                nameInput.setCustomValidity("");
            });
            nameForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                if (saveNameButton.disabled) return;
                const displayName = nameInput.value.trim();
                nameInput.setCustomValidity(
                    displayName ? "" : "Введите новое имя."
                );
                if (!nameInput.reportValidity()) return;
                setNameSaving(true);
                let failure = "";
                try {
                    const user = await getJSON("/api/auth/profile", {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            display_name: displayName
                        })
                    });
                    if (user === null) return;
                    renderProfile(user);
                    nameDialog.close();
                } catch (error) {
                    failure = errorMessage(error);
                } finally {
                    setNameSaving(false);
                }
                if (failure) {
                    nameInput.setCustomValidity(failure);
                    nameInput.reportValidity();
                }
            });
            logoutButton.addEventListener("click", async () => {
                if (logoutButton.disabled) return;
                logoutButton.disabled = true;
                try {
                    const result = await getJSON("/api/auth/logout", {
                        method: "POST"
                    });
                    if (result === null) return;
                    window.location.replace("/auth");
                } catch (error) {
                    profileStatus.textContent = errorMessage(error);
                    profileStatus.dataset.state = "error";
                    profileStatus.hidden = false;
                } finally {
                    logoutButton.disabled = false;
                }
            });
            filesPrev.addEventListener("click", () => {
                loadFiles(filesPage - 1);
            });
            filesNext.addEventListener("click", () => {
                loadFiles(filesPage + 1);
            });
            filesRefresh.addEventListener("click", () => {
                loadFiles(filesPage);
            });
            async function loadPage() {
                try {
                    const user = await getJSON("/api/auth/profile");
                    if (user === null) return;
                    renderProfile(user);
                    profileStatus.hidden = true;
                } catch (error) {
                    profileStatus.textContent = errorMessage(error);
                    profileStatus.dataset.state = "error";
                    profileStatus.hidden = false;
                    return;
                }
                await loadFiles(1);
            }
            updateFilesPagination();
            loadPage();
        })();
        </script>
</body>
</html>
